name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Project
        run: unzip examseek-oct-15-2026-3-39-40-pm.zip -d project_folder
        
      - name: Patch BuildConfig Error
        run: |
          find project_folder -name "*.kt" -exec sed -i 's/import com.example.BuildConfig//g' {} +
          find project_folder -name "*.kt" -exec sed -i 's/BuildConfig\.GEMINI_API_KEY/""/g' {} +
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build APK
        working-directory: ./project_folder
        run: gradle assembleDebug
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExamSeek-APK
          path: project_folder/app/build/outputs/apk/debug/app-debug.apk
